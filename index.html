<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kniha jízd">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>Kniha jízd</title>
  <style>
    :root {
      --bg: #0b1220; --card: #111827; --muted: #94a3b8; --text: #f8fafc;
      --accent: #38bdf8; --accent2: #22c55e; --danger: #ef4444; --line: #243041;
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:linear-gradient(180deg,#0b1220,#111827); color:var(--text); min-height:100vh; }
    .wrap { max-width:760px; margin:0 auto; padding:calc(16px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
    h1 { margin:0; font-size:1.6rem; }
    .badge { font-size:.8rem; color:#cbd5e1; background:#162033; padding:6px 10px; border-radius:999px; border:1px solid var(--line); }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .card { background:rgba(17,24,39,.92); border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:0 10px 30px rgba(0,0,0,.15); }
    .full { grid-column:1/-1; }
    .stat { font-size:1.8rem; font-weight:700; margin-top:4px; }
    .label { color:var(--muted); font-size:.85rem; }
    button { width:100%; border:0; border-radius:14px; padding:14px 16px; font:inherit; font-weight:700; cursor:pointer; }
    .primary { background:var(--accent); color:#062033; }
    .success { background:var(--accent2); color:#052e16; }
    .danger { background:var(--danger); color:white; }
    .secondary { background:#1e293b; color:var(--text); border:1px solid #334155; }
    .row { display:flex; gap:10px; }
    .row > * { flex:1; }
    input, select, textarea { width:100%; margin-top:6px; padding:12px; border-radius:12px; border:1px solid #334155; background:#0f172a; color:var(--text); font:inherit; }
    label { display:block; color:#cbd5e1; font-size:.9rem; margin:12px 0; }
    .trip { padding:12px 0; border-bottom:1px solid var(--line); }
    .trip:last-child { border-bottom:0; }
    .trip-top { display:flex; justify-content:space-between; gap:12px; }
    .trip-title { font-weight:700; }
    .small { color:var(--muted); font-size:.84rem; }
    .empty { color:var(--muted); text-align:center; padding:18px 0; }
    .hidden { display:none !important; }
    .gps { display:flex; align-items:center; gap:8px; color:#cbd5e1; font-size:.9rem; margin-top:10px; }
    .dot { width:9px; height:9px; border-radius:50%; background:#64748b; }
    .dot.live { background:#22c55e; box-shadow:0 0 0 5px rgba(34,197,94,.12); }
    .notice { margin-top:12px; color:#cbd5e1; font-size:.82rem; line-height:1.45; }
    dialog { width:min(92vw,620px); border:1px solid #334155; border-radius:18px; background:#111827; color:white; padding:0; }
    dialog::backdrop { background:rgba(0,0,0,.65); }
    .dialog-body { padding:18px; }
    .dialog-actions { display:flex; gap:10px; margin-top:16px; }
    .photo-preview { width:100%; max-height:220px; object-fit:cover; border-radius:12px; margin-top:8px; }
    @media (max-width:520px){ .grid{grid-template-columns:1fr}.full{grid-column:auto}.row{flex-direction:column} }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="label">PWA • data pouze v zařízení</div>
      <h1>🚗 Kniha jízd</h1>
    </div>
    <div class="badge" id="storageBadge">Lokální data</div>
  </header>

  <div class="grid">
    <section class="card">
      <div class="label">Počet jízd</div>
      <div class="stat" id="tripCount">0</div>
    </section>
    <section class="card">
      <div class="label">Celkem km</div>
      <div class="stat" id="totalKm">0,0</div>
    </section>

    <section class="card full">
      <div class="row">
        <button id="startBtn" class="success">▶ Zahájit jízdu</button>
        <button id="stopBtn" class="danger hidden">■ Ukončit jízdu</button>
        <button id="manualBtn" class="secondary">＋ Přidat ručně</button>
      </div>
      <div class="gps"><span id="gpsDot" class="dot"></span><span id="gpsStatus">GPS není aktivní</span></div>
      <div class="notice">GPS měření funguje jen pokud prohlížeč/PWA dostane oprávnění k poloze. iOS může sledování na pozadí omezovat.</div>
    </section>

    <section class="card full">
      <div class="trip-top">
        <div>
          <div class="trip-title">Historie jízd</div>
          <div class="small">Záznamy jsou uložené lokálně v tomto zařízení.</div>
        </div>
        <button id="exportBtn" class="secondary" style="width:auto;padding:10px 12px">Export</button>
      </div>
      <div id="tripList"></div>
    </section>
  </div>
</div>

<dialog id="tripDialog">
  <form method="dialog" id="tripForm" class="dialog-body">
    <h2 id="dialogTitle" style="margin-top:0">Nová jízda</h2>
    <label>Datum a čas začátku<input id="startTime" type="datetime-local" required></label>
    <label>Datum a čas konce<input id="endTime" type="datetime-local" required></label>
    <div class="row">
      <label>Počáteční stav km<input id="odoStart" type="number" min="0" step="0.1" placeholder="např. 42150"></label>
      <label>Koncový stav km<input id="odoEnd" type="number" min="0" step="0.1" placeholder="např. 42172"></label>
    </div>
    <label>Účel jízdy<input id="purpose" type="text" placeholder="např. pracovní cesta"></label>
    <label>Poznámka<textarea id="note" rows="2"></textarea></label>
    <label>Foto tachometru na začátku<input id="photoStart" type="file" accept="image/*" capture="environment"></label>
    <label>Foto tachometru na konci<input id="photoEnd" type="file" accept="image/*" capture="environment"></label>
    <div class="dialog-actions">
      <button type="button" class="secondary" id="cancelDialog">Zrušit</button>
      <button value="save" class="primary">Uložit</button>
    </div>
  </form>
</dialog>

<script>
const DB_NAME = 'knihaJizdDB';
const STORE = 'trips';
let db;
let watchId = null;
let activeTrip = null;

function openDb(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,1);
    req.onupgradeneeded=()=>{ const d=req.result; if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE,{keyPath:'id'}); };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
function txStore(mode='readonly'){ return db.transaction(STORE,mode).objectStore(STORE); }
function getAllTrips(){ return new Promise((res,rej)=>{const r=txStore().getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});}
function putTrip(t){ return new Promise((res,rej)=>{const r=txStore('readwrite').put(t);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}
function delTrip(id){ return new Promise((res,rej)=>{const r=txStore('readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}

const fmtDate=v=>new Intl.DateTimeFormat('cs-CZ',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v));
const fmtKm=n=>Number(n||0).toLocaleString('cs-CZ',{minimumFractionDigits:1,maximumFractionDigits:1});
const toLocalInput=d=>{const z=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`;};

function distanceM(a,b){
  const R=6371000, rad=x=>x*Math.PI/180;
  const dLat=rad(b.lat-a.lat), dLon=rad(b.lon-a.lon);
  const s=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}
async function fileToDataUrl(file){
  if(!file) return null;
  if(file.size > 4*1024*1024) throw new Error('Fotka je příliš velká. Zvol menší než 4 MB.');
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});
}

async function render(){
  const trips=(await getAllTrips()).sort((a,b)=>new Date(b.start)-new Date(a.start));
  document.getElementById('tripCount').textContent=trips.length;
  const total=trips.reduce((s,t)=>s+(Number(t.km)||0),0);
  document.getElementById('totalKm').textContent=fmtKm(total);
  const list=document.getElementById('tripList');
  if(!trips.length){ list.innerHTML='<div class="empty">Zatím tu není žádná jízda.</div>'; return; }
  list.innerHTML=trips.map(t=>`
    <div class="trip">
      <div class="trip-top">
        <div>
          <div class="trip-title">${escapeHtml(t.purpose||'Jízda')}</div>
          <div class="small">${fmtDate(t.start)} → ${fmtDate(t.end)}</div>
        </div>
        <div style="text-align:right">
          <div class="trip-title">${fmtKm(t.km)} km</div>
          <button class="secondary" style="width:auto;padding:6px 9px;margin-top:6px" onclick="removeTrip('${t.id}')">Smazat</button>
        </div>
      </div>
      ${t.note?'<div class="small" style="margin-top:7px">'+escapeHtml(t.note)+'</div>':''}
    </div>`).join('');
}
function escapeHtml(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
window.removeTrip=async id=>{ if(confirm('Smazat tuto jízdu?')){await delTrip(id);await render();} };

function setGps(active,text){
  document.getElementById('gpsDot').classList.toggle('live',active);
  document.getElementById('gpsStatus').textContent=text;
}
document.getElementById('startBtn').onclick=()=>{
  if(!navigator.geolocation){ alert('Toto zařízení nepodporuje geolokaci.'); return; }
  activeTrip={start:new Date().toISOString(),points:[],meters:0};
  document.getElementById('startBtn').classList.add('hidden');
  document.getElementById('manualBtn').classList.add('hidden');
  document.getElementById('stopBtn').classList.remove('hidden');
  setGps(true,'Čekám na GPS…');
  watchId=navigator.geolocation.watchPosition(pos=>{
    const p={lat:pos.coords.latitude,lon:pos.coords.longitude,acc:pos.coords.accuracy,time:Date.now()};
    if(p.acc<=100){
      const prev=activeTrip.points.at(-1);
      if(prev){ const d=distanceM(prev,p); if(d<1000) activeTrip.meters+=d; }
      activeTrip.points.push(p);
    }
    setGps(true,`GPS aktivní • přesnost ±${Math.round(pos.coords.accuracy)} m • ${(activeTrip.meters/1000).toFixed(2)} km`);
  },err=>setGps(false,'GPS chyba: '+err.message),{enableHighAccuracy:true,maximumAge:3000,timeout:15000});
};

document.getElementById('stopBtn').onclick=async()=>{
  if(watchId!==null) navigator.geolocation.clearWatch(watchId);
  watchId=null;
  const end=new Date();
  const trip={id:crypto.randomUUID(),start:activeTrip.start,end:end.toISOString(),km:activeTrip.meters/1000,purpose:'GPS jízda',note:'',points:activeTrip.points};
  await putTrip(trip);
  activeTrip=null;
  document.getElementById('startBtn').classList.remove('hidden');
  document.getElementById('manualBtn').classList.remove('hidden');
  document.getElementById('stopBtn').classList.add('hidden');
  setGps(false,'GPS není aktivní');
  await render();
};

const dialog=document.getElementById('tripDialog');
document.getElementById('manualBtn').onclick=()=>{
  const now=new Date(), later=new Date(now.getTime()+30*60000);
  document.getElementById('startTime').value=toLocalInput(now);
  document.getElementById('endTime').value=toLocalInput(later);
  document.getElementById('odoStart').value='';
  document.getElementById('odoEnd').value='';
  document.getElementById('purpose').value='';
  document.getElementById('note').value='';
  document.getElementById('photoStart').value='';
  document.getElementById('photoEnd').value='';
  dialog.showModal();
};
document.getElementById('cancelDialog').onclick=()=>dialog.close();

document.getElementById('tripForm').addEventListener('submit',async e=>{
  if(e.submitter?.value!=='save') return;
  e.preventDefault();
  try{
    const a=Number(document.getElementById('odoStart').value), b=Number(document.getElementById('odoEnd').value);
    const km=(Number.isFinite(a)&&Number.isFinite(b)&&b>=a)?b-a:0;
    const trip={
      id:crypto.randomUUID(),
      start:new Date(document.getElementById('startTime').value).toISOString(),
      end:new Date(document.getElementById('endTime').value).toISOString(),
      odoStart:a||null, odoEnd:b||null, km,
      purpose:document.getElementById('purpose').value.trim(),
      note:document.getElementById('note').value.trim(),
      photoStart:await fileToDataUrl(document.getElementById('photoStart').files[0]),
      photoEnd:await fileToDataUrl(document.getElementById('photoEnd').files[0])
    };
    await putTrip(trip); dialog.close(); await render();
  }catch(err){ alert(err.message||String(err)); }
});

document.getElementById('exportBtn').onclick=async()=>{
  const trips=await getAllTrips();
  const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),trips},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='kniha-jizd-zaloha.json'; a.click(); URL.revokeObjectURL(a.href);
};

(async()=>{
  db=await openDb();
  await render();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(console.warn);
})();
</script>
</body>
</html>
