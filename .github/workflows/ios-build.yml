name: iOS build
on:
  push:
    paths:
      - 'ios/**'
      - 'account.js'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript regression checks
        run: |
          node ios/Tests/native-bridge.cjs
          node tests/accounts.cjs
          node tests/trip-report.cjs
          node tests/pause.cjs
      - name: GPS distance regression checks
        run: |
          swiftc ios/KnihaJizd/DistanceAccumulator.swift ios/Tests/main.swift -o "$RUNNER_TEMP/distance-tests"
          "$RUNNER_TEMP/distance-tests"
      - name: Build app and widgets without signing
        run: |
          xcodebuild -version
          xcodebuild -project ios/KnihaJizd.xcodeproj -scheme KnihaJizd -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/kniha-build" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/ios-build.log" 2>&1 || { cat "$RUNNER_TEMP/ios-build.log"; exit 1; }
          tail -30 "$RUNNER_TEMP/ios-build.log"
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          log = (Path(os.environ['RUNNER_TEMP']) / 'ios-build.log').read_text()
          diagnostics = [line for line in log.splitlines() if 'warning:' in line or 'error:' in line]
          assert not diagnostics, '\n'.join(diagnostics)
          products = Path(os.environ['RUNNER_TEMP']) / 'kniha-build/Build/Products/Debug-iphonesimulator'
          for bundle in ['KnihaJizd.app', 'RideWidgets.appex']:
              metadata = products / bundle / 'Metadata.appintents'
              payload = b''.join(p.read_bytes() for p in metadata.rglob('*') if p.is_file())
              for name in [b'StartRideIntent', b'StopRideIntent', b'PauseRideIntent', b'ResumeRideIntent']:
                  assert name in payload, (bundle, name, 'Missing intent metadata')
              print(bundle, 'contains start, stop, pause and resume actions')
          PYTHON
      - name: Build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: '${{ runner.temp }}/ios-build.log'
